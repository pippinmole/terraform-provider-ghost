name: Tests

on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ["README.md", "ROADMAP.md", "CHANGELOG.md"]
  push:
    branches: [main]
    paths-ignore: ["README.md", "ROADMAP.md", "CHANGELOG.md"]

permissions:
  contents: read

jobs:
  build:
    name: Build & lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go build -v .
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

  generate:
    name: Docs up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: make generate
      - name: git diff
        run: |
          git diff --exit-code || \
            (echo; echo "Unexpected difference after 'make generate'. Run it and commit."; exit 1)

  test:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -v -cover ./...

  # Acceptance tests run against the live Ghost API and only on main/manual
  # dispatch, using the GHOST_TOKEN repository secret.
  acceptance:
    name: Acceptance tests (Terraform ${{ matrix.terraform }})
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        terraform: ["1.17.*"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go test -v -cover ./...
        env:
          TF_ACC: "1"
          GHOST_TOKEN: ${{ secrets.GHOST_TOKEN }}
